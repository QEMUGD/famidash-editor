<!DOCTYPE html>
<html lang="en">
<head>
    <title>GD2FD</title>
    <link rel="icon" type="image/png" href="../icon/cube.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 10px;
        }
        h1 {
            font-size: 35px;
            text-align: center;
            text-shadow: 0px 4px 15px #000;
            margin: 10px 0;
        }
        p {
            text-align: center;
            margin: 10px 0;
        }
        .main::-webkit-scrollbar, .main::-webkit-scrollbar { display: none }
        .button-container {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background-color: #0969da;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #0860ca;
        }
        button:active {
            background-color: #033d8b;
        }
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        #log {
            background-color: #111;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #statusText {
            text-align: center;
            color: #0969da;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <br><h1>Geometry Dash to Famidash Level Converter</h1>
    <hr>
    <p>Select a GMD file to convert to TMX format<br>File will automatically download when ready</p>
    <div class="button-container">
        <button id="uploadButton">📁 Choose GMD File</button>
    </div>
    <div id="statusText"></div>
    <input hidden type="file" id="fileLoad" accept=".gmd">
    <hr>
    <pre id="log" hidden></pre>
    <a id="downloader" hidden></a>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>
    <script>
        const log = document.getElementById('log');
        const statusText = document.getElementById('statusText');
        const uploadButton = document.getElementById('uploadButton');
        const fileInput = document.getElementById('fileLoad');

        function logLine(s = '') {
            log.textContent += s + '\n';
            log.scrollTop = log.scrollHeight;
            console.log(s);
        }

        function setStatus(s = '') {
            statusText.textContent = s;
        }

        let pyodide;
        let pyodidePromise = loadPyodide();
        let gmd = null;

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        document.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const files = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files : [];
            if (files.length > 0) {
                const droppedFile = files[0];
                if (droppedFile.name.endsWith('.gmd')) {
                    gmd = droppedFile;
                    await buildMain();
                } else {
                    setStatus('Error: File must be a .gmd file');
                }
            }
        });

        uploadButton.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const files = e.target && e.target.files ? e.target.files : [];
            if (files.length === 0) return;
            gmd = files[0];
            await buildMain();
        });

        async function saveTMX(gridWidth, gridHeight, tileGrid) {
            let tileData = '';
            for (let y = 0; y < gridHeight; y++) {
                tileData += '\n' + tileGrid[y].map(x => x + 1).join(',') + ',';
            }

            const xml = `<?xml version="1.0" encoding="UTF-8"?>
<map version="1.10" tiledversion="1.11.2" orientation="orthogonal" renderorder="right-down" width="${gridWidth}" height="${gridHeight}" tilewidth="16" tileheight="16" infinite="0" nextlayerid="3" nextobjectid="1">
  <tileset firstgid="1" name="famidash" tilewidth="16" tileheight="16" tilecount="256" columns="16">
    <image source="../../../GRAPHICS/famidash.bmp" width="256" height="256"/>
  </tileset>
  <layer id="1" width="${gridWidth}" height="${gridHeight}">
    <data encoding="csv">
      ${tileData.slice(1, -1)}
    </data>
  </layer>
</map>`;

            const blob = new Blob([xml], { type: 'application/xml' });
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement('a');
            downloadLink.style.display = 'none';
            downloadLink.href = url;
            downloadLink.download = 'level.tmx';
            document.body.appendChild(downloadLink);
            logLine('Downloading file...');
            downloadLink.click();
            downloadLink.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            setStatus('✓ Conversion complete!');
        }

        async function buildMain() {
            if (!gmd) {
                console.warn('No GMD file selected');
                return;
            }

            uploadButton.disabled = true;
            log.hidden = false;
            setStatus('Converting...');
            logLine(`Processing file: ${gmd.name}`);

            try {
                logLine('Loading pyodide...');
                pyodide = await pyodidePromise;
                logLine('Installing dependencies...');
                await pyodide.loadPackage('micropip');
                const micropip = await pyodide.pyimport('micropip');
                await micropip.install('gdparse');

                logLine('Reading file...');
                const fileText = new TextDecoder().decode(await gmd.arrayBuffer());

                logLine('Parsing GMD plist payload...');
                pyodide.runPython(`
import base64
import gzip
import json
import zlib
import xml.etree.ElementTree as ET

gmd_text = json.loads(${JSON.stringify(fileText)})
root = ET.fromstring(gmd_text)
items = list(root.iter())
encoded = None

for i, child in enumerate(items):
    if child.tag == 'k' and child.text == 'k4':
        for j in range(i + 1, len(items)):
            value = items[j]
            if value.tag in {'s', 'string', 'data'} and value.text is not None:
                encoded = value.text.strip()
                break
        break

if not encoded:
    raise ValueError('k4 key not found in GMD file')

encoded = encoded.replace('-', '+').replace('_', '/')
encoded += '=' * (-len(encoded) % 4)
raw = base64.b64decode(encoded)

for decoder in (gzip.decompress, zlib.decompress):
    try:
        decompressed = decoder(raw).decode('utf-8')
        break
    except Exception:
        decompressed = None

if decompressed is None:
    raise ValueError('Could not decompress k4 payload')

output = []
for item in decompressed.split(';'):
    if not item:
        continue
    parts = item.split(',')
    if len(parts) < 2:
        continue
    try:
        obj = dict(zip(map(int, parts[::2]), parts[1::2]))
        output.append(obj)
    except Exception:
        pass
`);

                const levelData = pyodide.globals.get('output').toJs();
                logLine(`Found ${levelData.length} objects in level`);

                const gridWidth = 1024;
                const gridHeight = 57;
                const tileGrid = Array.from({ length: gridHeight }, () => Array(gridWidth).fill(0));

                for (const object of levelData) {
                    const x = Number(object[2] ?? 0);
                    const y = Number(object[3] ?? 0);
                    const tx = Math.floor(x / 30);
                    const ty = gridHeight - 1 - Math.floor(y / 30);
                    if (Number.isFinite(tx) && Number.isFinite(ty) && tx >= 0 && ty >= 0 && tx < gridWidth && ty < gridHeight) {
                        tileGrid[ty][tx] = 1;
                    }
                }

                await saveTMX(gridWidth, gridHeight, tileGrid);
            } catch (error) {
                const msg = error && error.message ? error.message : String(error);
                logLine(`Error: ${msg}`);
                setStatus(`❌ Error: ${msg}`);
                console.error(error);
            } finally {
                uploadButton.disabled = false;
            }
        }
    </script>
</body>
</html>
